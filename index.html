<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>レトロ・スネークゲーム</title>
  <style>
    body {
      background-color: #1a1a2e;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      margin-bottom: 10px;
    }
    #score-board {
      font-size: 1.2rem;
      margin-bottom: 15px;
    }
    canvas {
      background-color: #16213e;
      border: 3px solid #e94560;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(233, 69, 96, 0.4);
    }
    .instructions {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #8a8a8a;
    }
  </style>
</head>
<body>

  <h1>SNAKE GAME</h1>
  <div id="score-board">SCORE: <span id="score">0</span></div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div class="instructions">矢印キー（↑ ↓ ← →）で操作 / 壁や自分にぶつかるとゲームオーバー</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');

    const gridSize = 20; // マスのサイズ
    const tileCount = canvas.width / gridSize; // 一辺のマス数 (20x20)

    let snake = [{ x: 10, y: 10 }]; // スネークの初期位置
    let food = { x: 15, y: 15 };    // エサの初期位置
    let dx = 0;                     // X軸の移動方向
    let dy = 0;                     // Y軸の移動方向
    let score = 0;
    let gameInterval;
    let isGameStarted = false;

    // キー入力の判定
    document.addEventListener('keydown', changeDirection);

    function changeDirection(event) {
      const keyPressed = event.keyCode;
      const LEFT = 37, UP = 38, RIGHT = 39, DOWN = 40;

      // ゲーム開始
      if (!isGameStarted && [LEFT, UP, RIGHT, DOWN].includes(keyPressed)) {
        isGameStarted = true;
        gameInterval = setInterval(gameLoop, 100); // 100msごとに更新
      }

      // 逆方向への即時転換を防止
      if (keyPressed === LEFT && dx !== 1) { dx = -1; dy = 0; }
      if (keyPressed === UP && dy !== 1) { dx = 0; dy = -1; }
      if (keyPressed === RIGHT && dx !== -1) { dx = 1; dy = 0; }
      if (keyPressed === DOWN && dy !== -1) { dx = 0; dy = 1; }
    }

    function gameLoop() {
      if (isGameOver()) {
        clearInterval(gameInterval);
        alert(`ゲームオーバー！ スコア: ${score}`);
        resetGame();
        return;
      }

      clearCanvas();
      moveSnake();
      drawFood();
      drawSnake();
    }

    function clearCanvas() {
      ctx.fillStyle = '#16213e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawSnake() {
      ctx.fillStyle = '#4ecca3';
      snake.forEach((part, index) => {
        // 頭だけ色を変える
        if (index === 0) ctx.fillStyle = '#239063';
        else ctx.fillStyle = '#4ecca3';

        ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
      });
    }

    function moveSnake() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };
      snake.unshift(head);

      // エサを食べた場合
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreElement.textContent = score;
        generateFood();
      } else {
        snake.pop(); // 食べていなければお尻を消す
      }
    }

    function drawFood() {
      ctx.fillStyle = '#e94560';
      ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
    }

    function generateFood() {
      food.x = Math.floor(Math.random() * tileCount);
      food.y = Math.floor(Math.random() * tileCount);
      // スネークの体の上にエサが出現した場合は再生成
      snake.forEach(part => {
        if (part.x === food.x && part.y === food.y) generateFood();
      });
    }

    function isGameOver() {
      const head = snake[0];
      // 壁への衝突判定
      const hitLeft = head.x < 0;
      const hitRight = head.x >= tileCount;
      const hitTop = head.y < 0;
      const hitBottom = head.y >= tileCount;

      // 自分の体への衝突判定
      let hitSelf = false;
      for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          hitSelf = true;
          break;
        }
      }

      return hitLeft || hitRight || hitTop || hitBottom || hitSelf;
    }

    function resetGame() {
      snake = [{ x: 10, y: 10 }];
      dx = 0;
      dy = 0;
      score = 0;
      scoreElement.textContent = score;
      isGameStarted = false;
      clearCanvas();
      drawSnake();
      drawFood();
    }

    // 初期描画
    resetGame();
  </script>
</body>
</html>
